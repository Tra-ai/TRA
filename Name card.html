<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--ink:#f2f5ee;--card:#1a1f1a;--line:#2c352c;--accent:#a6f01d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800}
main{max-width:480px;margin:0 auto;padding:24px 20px 40px}
.head{display:flex;align-items:center;gap:20px;font-size:clamp(40px,12vw,64px);line-height:1}
.chk{appearance:none;-webkit-appearance:none;width:52px;height:52px;flex:none;margin:0;border:7px solid var(--accent);border-radius:14px;background:var(--card);cursor:pointer;position:relative}
.chk:checked::after{content:"";position:absolute;left:12px;top:3px;width:14px;height:26px;border:solid var(--accent);border-width:0 7px 7px 0;transform:rotate(45deg)}
.chk:focus-visible,.field:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.field{display:block;width:100%;margin-top:28px;padding:18px 24px;border:5px solid var(--accent);border-radius:32px;background:var(--card);color:var(--accent);font:inherit;font-size:clamp(34px,10vw,52px)}
.banner{position:relative;width:calc(100% + 40px);margin:20px -20px 0;border:solid var(--accent);border-width:4px 0;border-radius:0;overflow:hidden;background:var(--card)}
.banner img{display:block;width:100%;aspect-ratio:4.6/1;object-fit:cover}
.banner .field{position:absolute;left:0;right:0;bottom:0;margin:0;width:100%;border:0;border-radius:0;background:rgba(11,11,11,.72);padding:12px 22px;font-size:clamp(28px,8vw,40px)}
.car{position:relative;margin-top:0;height:170px;border:4px solid var(--accent);border-radius:28px;overflow:hidden;background:var(--card)}
.slide{display:none;position:absolute;inset:0;padding:30px 56px;background-size:cover;background-position:center;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px}
.slide.on{display:flex}
.slide h2{margin:0;font-size:clamp(24px,7vw,32px);line-height:1.1}
.slide p{margin:0;font-size:15px;font-weight:700;opacity:.9}
.go{border:0;border-radius:16px;background:var(--accent);color:#0b0b0b;font:inherit;font-size:17px;padding:12px 22px;cursor:pointer}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(11,11,11,.7);color:var(--ink);font:inherit;font-size:28px;line-height:1;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:#888}.dots i.on{width:28px;background:var(--accent)}
.nav:focus-visible,.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
hr{border:0;height:10px;border-radius:5px;background:var(--accent);margin:36px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 24px}
.cell{height:76px;border:5px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;font-size:22px;cursor:pointer}
.cell[aria-pressed="true"]{background:var(--card);border-color:var(--accent)}
</style>
</head>
